name: Validate catalog and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/build_examples.py
      - run: python tools/validate_pack.py dist/*.zip
      - run: python tools/test_validator.py
